name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Google Play (for example 1.0.1)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
      # Real production API. Writes remain an explicit release opt-in.
      WINRAH_API_BASE_URL: https://train-api-uep7.onrender.com/
      WINRAH_API_ENVIRONMENT: production
      WINRAH_API_WRITES_ENABLED: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four signing secrets as described in docs/ANDROID_RELEASE.md." >&2
            exit 1
          fi

      - name: Decode and validate upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/win-rah-signing"
          mkdir -p "$signing_dir"
          encoded_keystore="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          encoded_length=${#encoded_keystore}
          remainder=$((encoded_length % 4))
          if [ "$remainder" -eq 1 ]; then
            echo "KEYSTORE_BASE64 has an invalid length after whitespace removal." >&2
            exit 1
          elif [ "$remainder" -eq 2 ]; then
            encoded_keystore="${encoded_keystore}=="
          elif [ "$remainder" -eq 3 ]; then
            encoded_keystore="${encoded_keystore}="
          fi
          printf '%s' "$encoded_keystore" | base64 --decode > "$signing_dir/upload-key.jks"
          keytool -list \
            -keystore "$signing_dir/upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null
          echo "KEYSTORE_PATH=$signing_dir/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signed outputs
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "Verified: $APK"
          echo "Verified: $AAB"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-rah-train-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/win-rah-signing"
